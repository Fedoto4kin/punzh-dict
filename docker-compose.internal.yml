services:
  django:
    container_name: punzh_web
    build:
      context: ./
      dockerfile: images/django/Dockerfile
    command: uwsgi --ini /app/uwsgi.ini
    volumes:
      - ./app:/app
      # Runtime secrets for Django (not baked into the image). docker restart re-reads it.
      - ./.env:/.env:ro
    expose:
      - "3000"
    ports:
      - "${DJANGO_PORT}:3000" 
    depends_on:
      - db
    networks:
      - punzh-internal

  db:
    container_name: punzh_db
    # Pin: stay on PG 15 (hub data). Do not use :latest — major jumps break ./db.
    image: pgvector/pgvector:0.8.7-pg15-bookworm
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./images/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=punzh_dict
    networks:
      - punzh-internal

networks:
  punzh-internal:
    driver: bridge
