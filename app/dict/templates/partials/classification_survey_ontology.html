{% if classification_survey_enabled %}
{# Invite banner on /ontology/ and field pages (corner flask stays on home only). #}
<div class="alert alert-info d-flex flex-wrap align-items-center justify-content-between mb-4" role="status">
  <div class="mr-3 mb-2 mb-md-0">
    <strong><i class="fas fa-flask" aria-hidden="true"></i> Исследование.</strong><br>
    Помогите сравнить автоматическую классификацию с человеческим восприятием.<br>
    Нам важна ваша помощь.
  </div>
  <button type="button"
          class="btn btn-primary btn-sm mb-0"
          data-cls-survey-open>
    Участвовать
  </button>
</div>
{% endif %}
