{% if tag_filter_groups %}
<style>
    .krl-tag-filters {
        border-top: 1px solid #dee2e6;
        border-bottom: 1px solid #dee2e6;
        padding: .5rem 0;
        margin: .5rem 0 1rem;
        font-size: .8rem;
        line-height: 1.35;
        max-width: 100%;
    }
    .krl-tag-filters .krl-tag-group + .krl-tag-group { margin-top: .35rem; }
    .krl-tag-filters .krl-tag-group-title {
        display: block;
        color: #6c757d;
        margin-bottom: .15rem;
        font-weight: 600;
    }
    .krl-tag-filters .krl-tag-opt {
        display: inline-block;
        max-width: 100%;
        box-sizing: border-box;
        padding: .05rem .35rem;
        margin: .1rem .15rem .1rem 0;
        border: 1px solid #ced4da;
        border-radius: .2rem;
        color: #495057;
        background: #fff;
        text-decoration: none;
        font-size: .75rem;
        line-height: 1.3;
        white-space: nowrap;
        vertical-align: bottom;
    }
    .krl-tag-filters .krl-tag-opt:hover {
        border-color: #007bff;
        color: #007bff;
        text-decoration: none;
    }
    .krl-tag-filters .krl-tag-opt.is-active {
        border-color: #007bff;
        background: #007bff;
        color: #fff;
    }
    @media (max-width: 575.98px) {
        .krl-tag-filters .krl-tag-opt {
            overflow: hidden;
            text-overflow: ellipsis;
        }
    }
</style>
<div class="krl-tag-filters" id="krlTagFilters">
    {% for group in tag_filter_groups %}
    <div class="krl-tag-group">
        {% if group.title %}
        <span class="krl-tag-group-title">{{ group.title }}:</span>
        {% endif %}
        {% for opt in group.options %}
        <a href="{{ list_base }}1{{ opt.t_query }}"
           class="krl-tag-opt{% if opt.selected %} is-active{% endif %}"
           title="{{ opt.label }}">{{ opt.label }}{% if opt.selected %} &times;{% endif %}</a>
        {% endfor %}
    </div>
    {% endfor %}
</div>
{% endif %}
