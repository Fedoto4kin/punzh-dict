[uwsgi]
master = true
chdir = /app
module = punzh.wsgi:application
env = DJANGO_SETTINGS_MODULE=punzh.settings

pidfile = /tmp/punzh-master.pid
http-socket = 0.0.0.0:3000
chmod-socket = 666

processes = 4
# Default listen backlog is 100; crawler bursts filled it (queue full).
listen = 256
harakiri = 20
max-requests = 5000
vacuum = true
single-interpreter = true
enable-threads = true

# Do not enable python-autoreload here: prod and internal compose use this
# file. Local Docker web uses Django runserver instead.
