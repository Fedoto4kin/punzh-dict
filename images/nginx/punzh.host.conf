# Host nginx for punzhina.krc.karelia.ru (not the docker ssl snippet).
# After git pull: collectstatic, then nginx -t && reload.
# STATIC_ROOT = app/staticfiles — do not alias app/static or app/dict/static.
#
# Live path on karielan-hub: /etc/nginx/sites-available/punzh.conf
# (checked 2026-10-28: no limit_req yet — keep this file in sync when editing).

# Shared search/API budget (per client IP). Tune if crawlers need more headroom.
limit_req_zone $binary_remote_addr zone=punzh_search:10m rate=30r/m;

server {
    listen 80;
    server_name punzhina.krc.karelia.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name punzhina.krc.karelia.ru;
    charset utf-8;
    client_max_body_size 75M;

    ssl_certificate /etc/letsencrypt/live/punzhina.krc.karelia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/punzhina.krc.karelia.ru/privkey.pem;

    location /static/ {
        alias /home/krl/punzh-dict/app/staticfiles/;
    }

    location /media/ {
        alias /home/krl/punzh-dict/app/media/;
    }

    # Lexical search: edge throttle (app also clips query length / DEBUG rate-limit).
    location ^~ /search/ {
        limit_req zone=punzh_search burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
